  <text x="78" y="306" font-size="50" font-weight="800" fill="#16181d" letter-spacing="-1.6">User-Activated Sidechains</text>
  <text x="80" y="366" font-size="22" fill="#5b6470">A chain that needs nothing from its parent.</text>
  <text x="80" y="396" font-size="22" fill="#5b6470">Blocks valid because signed. Every coin locked above.</text>
  <text x="80" y="426" font-size="22" fill="#5b6470">Every reader validates. Signers only order.</text>
